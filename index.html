<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Tablet Flip Clock</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#08090b;color:#f5f5f6}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(16px,3vw,36px)}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{color:#aaa;font-size:14px}.brand{font-weight:750;letter-spacing:.15em;color:#ddd}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{background:#202126;border:1px solid #393a40;color:#fff;padding:11px 14px;border-radius:12px;font-size:14px;cursor:pointer}button[aria-pressed=true]{background:#2c4037;border-color:#72b18a}button:focus-visible{outline:2px solid #b2f1c6}main{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:25px;min-height:0}.clock{display:flex;align-items:center;gap:clamp(5px,1.3vw,20px);width:100%;justify-content:center}.pair{display:flex;gap:clamp(3px,.5vw,8px)}.digit{position:relative;overflow:hidden;display:grid;place-items:center;background:linear-gradient(#24252a 49.4%,#111216 49.5%,#111216 50.5%,#202126 50.6%);border:1px solid #34353b;border-radius:clamp(8px,1.5vw,18px);width:clamp(43px,12vw,170px);height:clamp(86px,22vw,250px);font-size:clamp(64px,16vw,210px);font-weight:750;line-height:1;letter-spacing:-.07em;font-variant-numeric:tabular-nums;box-shadow:0 12px 25px #0007}.digit.changed{animation:flip .45s ease-out}@keyframes flip{0%{transform:perspective(700px) rotateX(-12deg);filter:brightness(1.7)}100%{transform:perspective(700px) rotateX(0);filter:brightness(1)}}.colon{font-size:clamp(34px,7vw,100px);color:#999;transform:translateY(-5%)}.date{color:#c6c6c9;font-size:clamp(16px,2.4vw,27px);text-align:center}.weather{color:#9b9ca2;font-size:clamp(13px,1.7vw,18px);text-align:center}.status{color:#9da0a6;font-size:12px}footer{padding-top:10px}.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center}input[type=checkbox]{accent-color:#8bd9a5;width:18px;height:18px}input[type=range]{width:90px;accent-color:#8bd9a5}.hidden{display:none!important}.dim{position:fixed;inset:0;background:black;pointer-events:none;z-index:5}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:8;padding:20px}.panel{width:min(450px,100%);background:#1b1c21;border:1px solid #3b3c42;border-radius:20px;padding:22px;display:grid;gap:15px}.panel input[type=text]{width:100%;background:#111;color:white;border:1px solid #555;border-radius:8px;padding:12px}.small{font-size:12px;color:#b5b5ba}.panel h2{margin:0}.panel .row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.digit{width:12vw;height:22vw;font-size:16vw}.clock{gap:1vw}.colon{font-size:7vw}header{justify-content:center}footer{justify-content:center}}@media(prefers-reduced-motion:reduce){.digit.changed{animation:none}}body.shift .clock{transform:translate(2px,1px)}
</style></head><body><header><div class="brand">FLIP CLOCK</div><div class="controls"><span id="network">OFFLINE READY</span><button id="settingsBtn">Settings ⚙</button><button id="fullBtn">Full screen</button></div></header><main><div class="clock" aria-label="Current time"><div class="pair" id="hours"></div><span class="colon">:</span><div class="pair" id="minutes"></div><span id="secondsWrap" class="hidden" style="display:flex;align-items:center;gap:5px"><span class="colon">:</span><div class="pair" id="seconds"></div></span></div><div class="date" id="date"></div><div class="weather" id="weather">Weather optional · clock works offline</div></main><footer><span class="status" id="awakeStatus">Screen awake: OFF</span><span class="status">Clock works without internet · Weather needs internet</span></footer><div id="shade" class="dim hidden"></div><div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><section class="panel"><h2 id="settingsTitle">Clock settings</h2><label><input id="awake" type="checkbox"> Keep screen awake (ON/OFF)</label><p class="small" style="margin:0">Requires browser support and a visible page. Android can still lock the screen; switch may turn off when you leave the app.</p><label><input id="format" type="checkbox"> 24-hour format</label><label><input id="showSeconds" type="checkbox"> Show seconds</label><label><input id="weatherToggle" type="checkbox"> Enable online weather (optional)</label><label><input id="burn" type="checkbox"> Gentle pixel shift (burn-in protection)</label><label>Dim display <input id="brightness" type="range" min="0" max="70" value="0"><span id="dimValue">0%</span></label><div id="weatherOptions" class="hidden"><label for="city">City</label><input type="text" id="city" placeholder="e.g. Kuala Lumpur"><div class="row"><button id="cityBtn">Search city</button><button id="geoBtn">Use my location</button></div><div class="small" id="weatherMessage"></div></div><div class="row"><button id="closeBtn">Close</button></div></section></div><script>
'use strict';const $=id=>document.getElementById(id);const defaults={awake:false,format:true,seconds:false,weather:false,burn:true,brightness:0,place:null};let prefs;try{prefs={...defaults,...JSON.parse(localStorage.getItem('flip-clock-settings')||'{}')}}catch{prefs={...defaults}}let wakeLock=null;let wakeRequest=0;const save=()=>{try{localStorage.setItem('flip-clock-settings',JSON.stringify(prefs))}catch{}};function digits(container,num){let s=String(num).padStart(2,'0');if(!container.children.length){for(let i=0;i<2;i++){let el=document.createElement('span');el.className='digit';container.append(el)}}[...container.children].forEach((el,i)=>{if(el.textContent!==s[i]){el.textContent=s[i];el.classList.remove('changed');void el.offsetWidth;el.classList.add('changed')}})}function tick(){let d=new Date(),h=d.getHours();digits($('hours'),prefs.format?h:(h%12||12));digits($('minutes'),d.getMinutes());if(prefs.seconds)digits($('seconds'),d.getSeconds());$('date').textContent=new Intl.DateTimeFormat('en-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)+(prefs.format?'':h>=12?' · PM':' · AM')};async function setAwake(on){wakeRequest++;const token=wakeRequest;prefs.awake=on;save();if(!on){if(wakeLock){try{await wakeLock.release()}catch{}wakeLock=null}renderAwake();return}if(!('wakeLock'in navigator)){$('awakeStatus').textContent='Screen awake unsupported by this browser';return}if(document.visibilityState!=='visible'){renderAwake();return}try{const lock=await navigator.wakeLock.request('screen');if(token!==wakeRequest||!prefs.awake){await lock.release();return}wakeLock=lock;lock.addEventListener('release',()=>{if(wakeLock===lock){wakeLock=null;renderAwake()}})}catch(e){wakeLock=null;$('awakeStatus').textContent='Screen awake unavailable: '+(e.name||'device restriction');return}renderAwake()}function renderAwake(){$('awake').checked=prefs.awake;$('awakeStatus').textContent=wakeLock?'Screen awake: ON':prefs.awake?'Screen awake: waiting / unavailable':'Screen awake: OFF'}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&prefs.awake)setAwake(true)});$('awake').addEventListener('change',e=>setAwake(e.target.checked));$('format').onchange=e=>{prefs.format=e.target.checked;save();tick()};$('showSeconds').onchange=e=>{prefs.seconds=e.target.checked;save();$('secondsWrap').classList.toggle('hidden',!prefs.seconds);tick()};$('burn').onchange=e=>{prefs.burn=e.target.checked;save()};$('brightness').oninput=e=>{prefs.brightness=+e.target.value;save();applyDim()};function applyDim(){$('shade').style.opacity=prefs.brightness/100;$('shade').classList.toggle('hidden',!prefs.brightness);$('dimValue').textContent=prefs.brightness+'%'}$('settingsBtn').onclick=()=>{$('modal').classList.remove('hidden');$('closeBtn').focus()};$('closeBtn').onclick=()=>{$('modal').classList.add('hidden')};$('modal').onclick=e=>{if(e.target===$('modal'))$('closeBtn').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('closeBtn').click()});$('fullBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Full screen is not supported in this browser. Try installing the app to your home screen.')}};function net(){ $('network').textContent=navigator.onLine?'ONLINE · OFFLINE READY':'OFFLINE MODE'}window.addEventListener('online',()=>{net();if(prefs.weather)updateWeather()});window.addEventListener('offline',net);
const WEATHER_CACHE='flip-clock-weather';function cachedWeather(){try{let c=JSON.parse(localStorage.getItem(WEATHER_CACHE)||'null');if(c)$('weather').textContent=c.text+' · saved '+new Date(c.at).toLocaleString()}catch{}}async function fetchJson(url){let r=await fetch(url,{signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('Weather service unavailable');return r.json()}const descriptions={0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',80:'Rain showers',81:'Rain showers',82:'Heavy showers',95:'Thunderstorms',96:'Thunderstorms',99:'Thunderstorms'};async function updateWeather(){if(!prefs.weather)return;if(!prefs.place){$('weather').textContent='Weather enabled · choose a city in Settings';return}if(!navigator.onLine){cachedWeather();return}try{let p=prefs.place,j=await fetchJson('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(p.lat)+'&longitude='+encodeURIComponent(p.lon)+'&current=temperature_2m,weather_code&timezone=auto');let c=j.current;let str=p.name+' · '+Math.round(c.temperature_2m)+'°C · '+(descriptions[c.weather_code]||'Weather');$('weather').textContent=str;localStorage.setItem(WEATHER_CACHE,JSON.stringify({text:str,at:Date.now()}));$('weatherMessage').textContent='Weather updated'}catch(e){cachedWeather();$('weatherMessage').textContent='Weather unavailable; showing saved data if present'}}$('weatherToggle').onchange=e=>{prefs.weather=e.target.checked;save();$('weatherOptions').classList.toggle('hidden',!prefs.weather);if(prefs.weather)updateWeather();else $('weather').textContent='Weather off · clock works offline'};$('cityBtn').onclick=async()=>{let q=$('city').value.trim();if(!q)return;$('weatherMessage').textContent='Searching…';try{let j=await fetchJson('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=en&format=json');if(!j.results?.length)throw Error('City not found');let p=j.results[0];prefs.place={lat:p.latitude,lon:p.longitude,name:p.name+', '+p.country};save();updateWeather()}catch(e){$('weatherMessage').textContent=e.message}};$('geoBtn').onclick=()=>{if(!navigator.geolocation){$('weatherMessage').textContent='Location unavailable';return}$('weatherMessage').textContent='Requesting location permission…';navigator.geolocation.getCurrentPosition(p=>{prefs.place={lat:p.coords.latitude,lon:p.coords.longitude,name:'Local weather'};save();updateWeather()},e=>{$('weatherMessage').textContent='Location unavailable: '+e.message},{timeout:12000,maximumAge:600000})};$('format').checked=prefs.format;$('showSeconds').checked=prefs.seconds;$('burn').checked=prefs.burn;$('weatherToggle').checked=prefs.weather;$('brightness').value=prefs.brightness;$('secondsWrap').classList.toggle('hidden',!prefs.seconds);$('weatherOptions').classList.toggle('hidden',!prefs.weather);applyDim();renderAwake();net();tick();setInterval(tick,250);setInterval(()=>{if(prefs.burn)document.body.classList.toggle('shift')},60000);if(prefs.weather){cachedWeather();updateWeather();setInterval(updateWeather,15*60*1000)}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
